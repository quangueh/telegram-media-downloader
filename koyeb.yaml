name: telegram-media-downloader
services:
  - name: bot
    type: worker
    instance_type: nano
    regions:
      - fra
    build:
      docker:
        dockerfile: Dockerfile
    env:
      - key: BOT_TOKEN
        value: "{{ secret.TELEGRAM_BOT_TOKEN }}"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: USER_RATE_LIMIT_SECONDS
        value: "5"
      - key: MAX_VIDEO_DURATION
        value: "600"
      - key: URL_VALIDATION_TIMEOUT
        value: "8"
      - key: YOUTUBE_PROXY
        value: ""
      - key: YOUTUBE_POT_PROVIDER_URL
        value: ""
