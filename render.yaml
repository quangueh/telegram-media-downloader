services:
  - type: web
    name: telegram-media-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: REQUEST_TIMEOUT
        value: "180"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: USER_RATE_LIMIT_SECONDS
        value: "5"
      - key: MAX_VIDEO_DURATION
        value: "600"
      - key: URL_VALIDATION_TIMEOUT
        value: "8"
      - key: YOUTUBE_COOKIES
        value: ""
      - key: YOUTUBE_COOKIES_B64
        sync: false
      - key: TIKTOK_COOKIES
        value: ""
      - key: ADMIN_USER_ID
        value: ""
