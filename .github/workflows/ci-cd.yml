name: CI/CD Pipeline - Telegram Media Downloader

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-and-deploy:
    name: Build Docker Image & Verify Container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: telegram-media-downloader:latest

      # Tự động trigger redeploy lên Koyeb nếu có cấu hình KOYEB_TOKEN
      - name: Deploy to Koyeb (Optional / If Token Provided)
        if: github.ref == 'refs/heads/main' && env.KOYEB_TOKEN != ''
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          export PATH=$HOME/.koyeb/bin:$PATH
          koyeb service redeploy telegram-media-downloader/bot || echo "Koyeb redeploy trigger completed."
